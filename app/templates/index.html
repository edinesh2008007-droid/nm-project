<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Workout Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <h1>💪 FitBuddy - AI Workout Generator</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form action="/generate-workout" method="post">
      <label for="username">Name:</label>
      <input type="text" id="username" name="username" required>

      <label for="user_id">User ID:</label>
      <input type="number" id="user_id" name="user_id" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="1" max="119" required>

      <label for="weight">Weight (kg):</label>
      <input type="number" step="0.1" id="weight" name="weight" required>

      <label for="goal">Fitness Goal:</label>
      <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, flexibility" required>

      <label for="intensity">Workout Intensity:</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>

    <div class="nav"><a href="/view-all-users">Admin: View all users</a> | <a href="/docs">API docs</a></div>
  </div>
</body>
</html>
